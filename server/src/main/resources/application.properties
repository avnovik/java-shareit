server.port=9090

# JPA/Hibernate: do NOT create tables from entities (use schema.sql instead)
spring.jpa.hibernate.ddl-auto=none
# Pretty SQL in logs (format only)
spring.jpa.properties.hibernate.format_sql=true
# Run schema.sql on startup (create tables)
spring.sql.init.mode=always

# Hibernate debug
hibernate.show_sql=true
hibernate.jdbc.time_zone=UTC

# Logs: transactions + SQL init
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.orm.jpa.JpaTransactionManager=INFO
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.boot.sql.init=DEBUG
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.transaction.interceptor=INFO
logging.level.ru.practicum.shareit=DEBUG

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/shareit
spring.datasource.username=shareit
spring.datasource.password=shareit